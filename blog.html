<script src="data-artikel.js"></script>
<script>
    const container = document.getElementById('article-container');
    
    // Loop data dari file data-artikel.js
    articles.forEach(item => {
        // Tentukan link tujuan
        // Jika item.id berisi ".html", berarti file terpisah. 
        // Jika tidak, kita asumsikan link manual (baca.html?id=...)
        let linkUrl = item.id.includes('.html') ? item.id : `baca.html?id=${item.id}`;

        const card = `
            <article class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                <span class="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-bold mb-3 inline-block">${item.category}</span>
                <a href="${linkUrl}">
                    <h2 class="text-xl font-bold mb-3 text-gray-800 hover:text-blue-600 cursor-pointer">${item.title}</h2>
                </a>
                <p class="text-gray-600 text-sm leading-relaxed mb-4">${item.summary}</p>
                <a href="${linkUrl}" class="text-blue-600 text-sm font-semibold hover:underline">Baca Selengkapnya →</a>
            </article>
        `;
        container.innerHTML += card;
    });
</script>
