<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Artikel - Teman HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="blog.html" class="text-gray-500 hover:text-blue-600 flex items-center gap-2 font-medium">← Kembali ke Blog</a>
            <span class="text-xl font-bold text-blue-600">Teman<span class="text-gray-900">HR</span></span>
        </div>
    </nav>

    <article class="max-w-3xl mx-auto px-4 py-12">
        <div id="article-content">
            <p class="text-center text-gray-500">Memuat artikel...</p>
        </div>
    </article>

    <script src="data-artikel.js"></script>
    <script>
        // 1. Ambil ID dari URL (contoh: baca.html?id=kpi-fair)
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        // 2. Cari artikel yang cocok di database
        const article = articles.find(item => item.id === articleId);

        // 3. Tampilkan ke layar
        const contentDiv = document.getElementById('article-content');
        
        if (article) {
            document.title = article.title + " - Teman HR"; // Ubah judul tab browser
            contentDiv.innerHTML = `
                <header class="mb-8 text-center">
                    <span class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase mb-4 inline-block">${article.category}</span>
                    <h1 class="text-3xl md:text-4xl font-bold text-gray-900 leading-tight mb-4">${article.title}</h1>
                    <div class="flex justify-center items-center gap-4 text-gray-500 text-sm">
                        <span>${article.author}</span> • <span>${article.date}</span>
                    </div>
                </header>

                <div class="mb-10 rounded-xl overflow-hidden shadow-lg">
                    <img src="${article.image}" onerror="this.src='https://placehold.co/800x400?text=No+Image'" class="w-full h-auto">
                </div>

                <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
                    ${article.content}
                </div>
            `;
        } else {
            contentDiv.innerHTML = `<h1 class="text-center text-2xl font-bold text-red-500">Artikel tidak ditemukan :(</h1>`;
        }
    </script>

</body>
</html>
