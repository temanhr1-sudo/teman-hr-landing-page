<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Generator V3 (Ads + Folder) - Teman HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center gap-3 mb-2">
            <h1 class="text-3xl font-bold text-white">⚡ Admin Generator V3</h1>
            <span class="bg-green-500 text-black text-xs font-bold px-2 py-1 rounded">ADSENSE READY</span>
            <span class="bg-yellow-500 text-black text-xs font-bold px-2 py-1 rounded">SUB-FOLDER</span>
        </div>
        <p class="text-slate-400 mb-8">Otomatis menyelipkan kode iklan di posisi strategis artikel.</p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
                <h2 class="text-xl font-bold mb-4 text-blue-400">1. Input Data Artikel</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Judul Artikel</label>
                        <input type="text" id="inputTitle" oninput="generateSlug()" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 focus:border-blue-500 outline-none" placeholder="Contoh: Cara Menghitung PPh 21">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Kategori</label>
                            <select id="inputCategory" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2">
                                <option value="STRATEGI">STRATEGI</option>
                                <option value="TUTORIAL">TUTORIAL</option>
                                <option value="KARIR">KARIR</option>
                                <option value="PAYROLL">PAYROLL</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Tanggal</label>
                            <input type="text" id="inputDate" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2" placeholder="Ex: 5 Feb 2026">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Penulis</label>
                        <input type="text" id="inputAuthor" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2" value="Ari Ramadhan">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Nama File Gambar (di folder gambar/)</label>
                        <input type="text" id="inputImage" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2" placeholder="contoh: kpi-meeting.png">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Nama File HTML (Otomatis)</label>
                        <input type="text" id="inputSlug" class="w-full bg-slate-700 border border-slate-600 rounded px-3 py-2 text-slate-400 cursor-not-allowed" readonly>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Ringkasan (Untuk Card)</label>
                        <textarea id="inputSummary" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2" placeholder="Tulis 1-2 kalimat menarik..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Isi Artikel (Format HTML)</label>
                        <textarea id="inputContent" rows="10" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 font-mono text-sm" placeholder="<p>Paragraf pertama...</p>"></textarea>
                    </div>

                    <button onclick="generateCode()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition mt-4 shadow-lg border border-green-500">
                        💰 GENERATE WITH ADS
                    </button>
                </div>
            </div>

            <div class="space-y-8">
                
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 relative">
                    <h2 class="text-xl font-bold mb-2 text-green-400">Output 1: Copy ke `data-artikel.js`</h2>
                    <button onclick="copyToClipboard('outputJS')" class="absolute top-6 right-6 bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs">Copy</button>
                    <textarea id="outputJS" class="w-full h-40 bg-slate-950 text-green-400 font-mono text-xs p-4 rounded border border-slate-700 focus:outline-none" readonly></textarea>
                </div>

                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 relative">
                    <h2 class="text-xl font-bold mb-2 text-purple-400">Output 2: Buat File di Folder `artikel/`</h2>
                    <p class="text-xs text-slate-400 mb-2">Kode iklan sudah otomatis terpasang di Head dan Body.</p>
                    <div class="mb-2">
                        <span class="text-xs font-bold text-slate-300">Simpan sebagai: </span>
                        <span id="displayFileName" class="text-xs text-yellow-400 font-mono">artikel/...</span>
                    </div>
                    <button onclick="copyToClipboard('outputHTML')" class="absolute top-6 right-6 bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs">Copy</button>
                    <textarea id="outputHTML" class="w-full h-96 bg-slate-950 text-purple-200 font-mono text-xs p-4 rounded border border-slate-700 focus:outline-none" readonly></textarea>
                </div>

            </div>
        </div>
    </div>

    <script>
        function generateSlug() {
            const title = document.getElementById('inputTitle').value;
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            document.getElementById('inputSlug').value = 'artikel-' + slug + '.html';
            document.getElementById('displayFileName').innerText = 'artikel/artikel-' + slug + '.html';
        }

        function generateCode() {
            const title = document.getElementById('inputTitle').value;
            const category = document.getElementById('inputCategory').value;
            const date = document.getElementById('inputDate').value;
            const author = document.getElementById('inputAuthor').value;
            const image = document.getElementById('inputImage').value;
            const filename = document.getElementById('inputSlug').value;
            const summary = document.getElementById('inputSummary').value;
            const content = document.getElementById('inputContent').value;

            // OUTPUT 1: JS
            const jsCode = `    {
        id: "artikel/${filename}",
        category: "${category}",
        date: "${date}",
        title: "${title}",
        author: "${author}",
        image: "gambar/${image}",
        summary: "${summary}",
        isExternal: true
    },`;
            document.getElementById('outputJS').value = jsCode;

            // OUTPUT 2: HTML with ADSENSE
            // Kita gunakan ID Adsense Mas Ari: ca-pub-9004113328614297
            
            let htmlCode = `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} - Teman HR</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9004113328614297" crossorigin="anonymous"><\/script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="../blog.html" class="text-gray-500 hover:text-blue-600 flex items-center gap-2 font-medium">
                ← Kembali ke Blog
            </a>
            <a href="../index.html" class="text-xl font-bold text-blue-600">Teman<span class="text-gray-900">HR</span></a>
        </div>
    </nav>

    <article class="max-w-3xl mx-auto px-4 py-12">
        
        <header class="mb-8 text-center">
            <span class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase mb-4 inline-block">${category}</span>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 leading-tight mb-4">${title}</h1>
            <div class="flex justify-center items-center gap-4 text-gray-500 text-sm">
                <span>Ditulis oleh: <b>${author}</b></span>
                <span>•</span>
                <span>${date}</span>
            </div>
        </header>

        <div class="mb-10 rounded-xl overflow-hidden shadow-lg">
            <img src="../gambar/${image}" onerror="this.src='https://placehold.co/800x400/e2e8f0/1e40af?text=No+Image'" alt="${title}" class="w-full h-auto">
        </div>

        <div class="my-8 p-4 bg-gray-100 rounded text-center border border-dashed border-gray-300">
            <span class="text-xs text-gray-400 block mb-2">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-9004113328614297"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            <\/script>
        </div>

        <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
            ${content}
        </div>

        <div class="my-8 p-4 bg-gray-100 rounded text-center border border-dashed border-gray-300">
            <span class="text-xs text-gray-400 block mb-2">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-9004113328614297"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            <\/script>
        </div>

        <div class="mt-8 p-6 bg-blue-50 rounded-xl border border-blue-100 text-center">
            <h4 class="font-bold text-blue-800 mb-2">Ingin Tools HR Otomatis?</h4>
            <p class="text-sm text-blue-600 mb-4">Kami punya tools Excel dan E-Book premium untuk HRD.</p>
            <a href="../toko.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Lihat Toko →</a>
        </div>

    </article>

    <footer class="bg-gray-900 text-white py-8 text-center">
        <p>&copy; 2026 Teman HR. All rights reserved.</p>
    </footer>

</body>
</html>`;

            document.getElementById('outputHTML').value = htmlCode;
        }

        function copyToClipboard(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            alert('Kode berhasil dicopy!');
        }
    </script>
</body>
</html>
